name: preview-screenshots

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch: {}

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'simulator-screenshots')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: magucc/struktr@main
        with:
          apk-path: app/build/outputs/apk/debug/app-debug.apk
